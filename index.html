<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D UNIT</title>
<link rel="icon" type="image/png" href="short_logo.png">
<meta name="description" content="Bộ sưu tập object 3D miễn phí của ThienSon. Di chuột để xoay, giữ để phóng to, tải ảnh về.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0b;
    --cell: #141416;
    --yellow: #FFC700;
    --text: #CFCFCF;
    --muted: #8f8d86;
    --maxw: 1080px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; min-height:100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  @media (prefers-reduced-motion: reduce){
    * { animation-duration: 0.001ms !important; }
  }

  .wrap{
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 32px;
  }

  /* ---------- HEADER ---------- */
  header{
    position: sticky;
    top: 0;
    z-index: 150;
    background: var(--bg);
    border-bottom: 1px solid rgba(255,255,255,0.14);
  }
  header .wrap{
    display:flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 20px;
    padding-bottom: 20px;
  }
  .logo{
    font-family: 'Archivo Black', sans-serif;
    font-size: 17px;
    letter-spacing: 0.01em;
    text-decoration: none;
    color: var(--text);
  }
  .logo span{ color: var(--yellow); }

  /* ---------- MENU BUTTON + FULLSCREEN OVERLAY ---------- */
  .menu-btn{
    display:flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    width: 26px;
    height: 20px;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .menu-btn span{
    display:block;
    width: 100%;
    height: 2px;
    background: var(--yellow);
    border-radius: 1px;
  }
  .menu-overlay{
    position: fixed;
    inset: 0;
    background: rgba(255, 199, 0, 0.9);
    z-index: 200;
    display:flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease;
  }
  .menu-overlay.open{
    opacity: 1;
    visibility: visible;
  }
  .menu-close{
    position: absolute;
    top: 22px;
    right: 32px;
    width: 34px;
    height: 34px;
    background: none;
    border: none;
    cursor: pointer;
    color: #333333;
  }
  .menu-close svg{ width: 100%; height: 100%; display:block; }
  .menu-list{
    display:flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    overflow: hidden;
  }
  .menu-list a{
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(24px, 4vw, 40px);
    letter-spacing: 0.01em;
    color: #333333;
    text-decoration: none;
    opacity: 0;
    transform: translateY(140px);
    transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .menu-list a.show{
    opacity: 1;
    transform: translateY(0);
  }
  .menu-list a:hover{ opacity: 0.6; }

  /* ---------- HERO (logo image + credit + caption, like the reference design) ---------- */
  .hero{
    padding: 40px 0 46px;
  }
  .hero-row{
    position: relative;
  }
  .hero-logo{
    width: 100%;
    height: auto;
    display: block;
  }
  .logo-fallback{
    display:flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    gap: 8px;
    width: 100%;
    height: 160px;
    border: 1px dashed rgba(255,199,0,0.35);
    border-radius: 10px;
    padding: 0 22px;
  }
  .logo-fallback span{
    font-family: 'Archivo Black', sans-serif;
    font-size: 26px;
    letter-spacing: 0.02em;
    color: var(--yellow);
  }
  .logo-fallback small{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--muted);
  }
  .hero-bottom-row{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-top: 18px;
    gap: 20px;
  }
  .hero-credit{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .hero-caption{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    line-height: 1.7;
    margin: 0;
  }

  /* ---------- GRID ---------- */
  .grid-section{ padding-bottom: 80px; }
  .grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
  }
  @media (max-width: 860px){ .grid{ grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 560px){ .grid{ grid-template-columns: repeat(2, 1fr); gap: 12px; } }

  .cell{
    position: relative;
    aspect-ratio: 1 / 1;
    background: var(--cell);
    border-radius: 16px;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    user-select: none;
    box-shadow: 0 10px 24px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.04);
    transition: box-shadow 0.2s ease;
  }
  .cell:hover{
    box-shadow: 0 14px 32px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,199,0,0.25);
  }
  .cell:active{ cursor: grabbing; }
  .cell canvas{
    display:block;
    width: 100%;
    height: 100%;
  }

  .cell-label{
    position:absolute;
    left:0; right:0; bottom:0;
    display:flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 14px 0 0;
    background: linear-gradient(to top, rgba(0,0,0,0.78), transparent);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
  }
  .cell:hover .cell-label, .cell:focus-within .cell-label{
    opacity: 1;
    transform: translateY(0);
  }
  .shape-name{
    font-family: 'Roboto', sans-serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text);
    margin-bottom: 11px;
  }
  .dl-btn{
    position: relative;
    font-family: 'Roboto', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    background: transparent;
    border: none;
    padding: 9px 30px 9px 16px;
    cursor: pointer;
    pointer-events: all;
  }
  .dl-btn::before,
  .dl-btn::after{
    content: '';
    position: absolute;
    clip-path: polygon(0 0, 100% 0, 82% 50%, 100% 100%, 0 100%);
  }
  .dl-btn::before{
    /* outer layer: always the yellow outline colour */
    inset: 0;
    background: var(--yellow);
    z-index: 0;
  }
  .dl-btn::after{
    /* inner layer: cell-dark by default (creates the outline look), turns yellow on hover/done */
    inset: 1.5px;
    background: var(--cell);
    transition: background 0.15s ease;
    z-index: 1;
  }
  .dl-btn:hover::after,
  .dl-btn.done::after{
    background: var(--yellow);
  }
  .btn-label{
    position: relative;
    z-index: 2;
    color: var(--yellow);
    transition: color 0.15s ease;
  }
  .dl-btn:hover .btn-label,
  .dl-btn.done .btn-label{
    color: #333333;
  }

  /* ---------- FOOTER ---------- */
  footer{ border-top: 1px solid rgba(255,199,0,0.14); }
  footer .wrap{
    padding: 22px 0;
    display:flex;
    justify-content: space-between;
    align-items:center;
    flex-wrap: wrap;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }
  footer a{ color: var(--yellow); text-decoration:none; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a href="#" class="logo">Thien<span>Son</span></a>
    <button class="menu-btn" id="menuBtn" aria-label="Mở menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<div class="menu-overlay" id="menuOverlay">
  <button class="menu-close" id="menuClose" aria-label="Đóng menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="4" x2="20" y2="20"></line><line x1="20" y1="4" x2="4" y2="20"></line></svg>
  </button>
  <nav class="menu-list">
    <a href="#">What is this?</a>
    <a href="#">About me</a>
    <a href="#">Contact</a>
    <a href="https://www.behance.net/snthin" target="_blank" rel="noopener">Follow on Behance</a>
  </nav>
</div>

<div class="wrap">
  <div class="hero">
    <div class="hero-row">
      <img src="logo.png" alt="ThienSon logo" class="hero-logo" id="heroLogo">
      <div class="logo-fallback" id="logoFallback" style="display:none;">
        <span>ThienSon</span>
        <small>Đặt file logo.png cùng thư mục để hiển thị logo tại đây</small>
      </div>
    </div>
    <div class="hero-bottom-row">
      <p class="hero-caption">Browse 20+ PNG shapes<br>for your next project. Click to save.</p>
      <span class="hero-credit">Create by TSONZ</span>
    </div>
  </div>
</div>

<div class="grid-section">
  <div class="wrap">
    <div class="grid" id="grid"></div>
  </div>
</div>

<footer>
  <div class="wrap">
    <span>© 2026 ThienSon</span>
  </div>
</footer>

<script>
  // show a placeholder if logo.png hasn't been added yet
  var heroLogo = document.getElementById('heroLogo');
  heroLogo.addEventListener('error', function(){
    heroLogo.style.display = 'none';
    document.getElementById('logoFallback').style.display = 'flex';
  });

  // fullscreen menu overlay
  var menuBtn = document.getElementById('menuBtn');
  var menuClose = document.getElementById('menuClose');
  var menuOverlay = document.getElementById('menuOverlay');
  var menuItems = Array.prototype.slice.call(menuOverlay.querySelectorAll('.menu-list a'));
  var menuTimers = [];

  function clearMenuTimers(){
    menuTimers.forEach(function(t){ clearTimeout(t); });
    menuTimers = [];
  }

  function openMenu(){
    clearMenuTimers();
    menuOverlay.classList.add('open');
    menuBtn.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
    menuItems.forEach(function(item, i){
      var t = setTimeout(function(){ item.classList.add('show'); }, 100 + i * 180);
      menuTimers.push(t);
    });
  }
  function closeMenu(){
    clearMenuTimers();
    menuOverlay.classList.remove('open');
    menuBtn.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
    menuItems.forEach(function(item){ item.classList.remove('show'); });
  }

  menuBtn.addEventListener('click', openMenu);
  menuClose.addEventListener('click', closeMenu);
  menuOverlay.addEventListener('click', function(e){
    if (e.target === menuOverlay) closeMenu();
  });
  window.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeMenu();
  });
</script>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
(function(){

  var shapeDefs = [
    { name: "Lập phương",    make: function(){ return new THREE.BoxGeometry(1.3,1.3,1.3); } },
    { name: "Cầu đa diện",   make: function(){ return new THREE.IcosahedronGeometry(1.15, 0); } },
    { name: "Vòng xuyến",    make: function(){ return new THREE.TorusGeometry(0.85, 0.32, 10, 24); } },
    { name: "Hình nón",      make: function(){ return new THREE.ConeGeometry(1, 1.6, 5); } },
    { name: "Bát diện",      make: function(){ return new THREE.OctahedronGeometry(1.25, 0); } },
    { name: "Trụ tròn",      make: function(){ return new THREE.CylinderGeometry(0.75, 0.75, 1.6, 8); } },
    { name: "Nút xoắn",      make: function(){ return new THREE.TorusKnotGeometry(0.65, 0.22, 64, 8); } },
    { name: "Thập nhị diện", make: function(){ return new THREE.DodecahedronGeometry(1.1, 0); } },
    { name: "Tứ diện",       make: function(){ return new THREE.TetrahedronGeometry(1.4, 0); } },
    { name: "Đá quý",        make: function(){ return new THREE.IcosahedronGeometry(1.1, 1); } },
    { name: "Kim tự tháp",   make: function(){ return new THREE.ConeGeometry(1.1, 1.6, 4); } },
    { name: "Hộp bát giác",  make: function(){ return new THREE.CylinderGeometry(1, 1, 1.1, 8); } },
    { name: "Lăng trụ",      make: function(){ return new THREE.CylinderGeometry(0.9, 0.9, 1.4, 6); } },
    { name: "Vòng mỏng",     make: function(){ return new THREE.TorusGeometry(1, 0.16, 8, 30); } },
    { name: "Hạt kim cương", make: function(){ return new THREE.OctahedronGeometry(1.3, 1); } },
    { name: "Khối vuông bo", make: function(){ return new THREE.IcosahedronGeometry(1.2, 2); } },
    { name: "Nón cụt",       make: function(){ return new THREE.CylinderGeometry(0.4, 1.1, 1.5, 5); } },
    { name: "Sao 5 cạnh",    make: function(){ return new THREE.DodecahedronGeometry(1.2, 1); } },
    { name: "Xoắn kép",      make: function(){ return new THREE.TorusKnotGeometry(0.6, 0.18, 80, 6, 2, 3); } },
    { name: "Trụ lục giác",  make: function(){ return new THREE.CylinderGeometry(1, 1, 1.2, 6); } }
  ];

  var grid = document.getElementById('grid');
  var cells = [];
  var DPR = Math.min(window.devicePixelRatio || 1, 2);

  // ---- single shared WebGL renderer used to draw every object, then copied
  // onto each cell's own lightweight 2D canvas. Avoids creating 20 separate
  // WebGL contexts (browsers cap that around ~16, which was corrupting the
  // first few shapes once the grid grew past that limit).
  var sharedCanvas = document.createElement('canvas');
  var sharedRenderer = new THREE.WebGLRenderer({ canvas: sharedCanvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
  sharedRenderer.setPixelRatio(DPR);

  var mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
  window.addEventListener('pointermove', function(e){
    mouseX = e.clientX;
    mouseY = e.clientY;
  }, { passive: true });

  shapeDefs.forEach(function(def, i){
    var cell = document.createElement('div');
    cell.className = 'cell';

    var canvas = document.createElement('canvas');
    var ctx2d = canvas.getContext('2d');
    cell.appendChild(canvas);

    var label = document.createElement('div');
    label.className = 'cell-label';
    label.innerHTML = '<button class="dl-btn" type="button"><span class="btn-label">Tải PNG</span></button><span class="shape-name">' + def.name + '</span>';
    cell.appendChild(label);

    grid.appendChild(cell);

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
    camera.position.set(0, 0, 4.4);

    var ambient = new THREE.AmbientLight(0xffffff, 0.55);
    scene.add(ambient);
    var key = new THREE.DirectionalLight(0xffffff, 0.9);
    key.position.set(2, 3, 4);
    scene.add(key);
    var rim = new THREE.DirectionalLight(0xffc700, 0.5);
    rim.position.set(-3, -2, -2);
    scene.add(rim);

    var group = new THREE.Group();
    scene.add(group);

    var geo = def.make();
    var solidMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1f, roughness: 0.55, metalness: 0.15 });
    var solid = new THREE.Mesh(geo, solidMat);
    group.add(solid);

    var edgesGeo = new THREE.EdgesGeometry(geo, 20);
    var edgesMat = new THREE.LineBasicMaterial({ color: 0xffc700 });
    var edges = new THREE.LineSegments(edgesGeo, edgesMat);
    group.add(edges);

    var state = {
      scene: scene, camera: camera, group: group,
      canvas: canvas, ctx2d: ctx2d, cell: cell,
      idleSpin: Math.random() * Math.PI * 2,
      focusX: 0, focusY: 0,
      inertiaX: 0, inertiaY: 0,
      scaleCurrent: 1, scaleTarget: 1,
      holding: false,
      lastX: 0, lastY: 0
    };
    cells.push(state);

    function startHold(clientX, clientY){
      state.holding = true;
      state.scaleTarget = 1.45;
      state.lastX = clientX;
      state.lastY = clientY;
    }
    function endHold(){
      state.holding = false;
      state.scaleTarget = 1;
    }

    cell.addEventListener('pointerdown', function(e){
      if (e.target.closest('.dl-btn')) return;
      startHold(e.clientX, e.clientY);
    });

    // holding + dragging keeps spinning the object even once the cursor
    // leaves this cell's bounds — it only stops on release, listened on
    // window so it tracks the cursor anywhere on the page.
    window.addEventListener('pointermove', function(e){
      if (!state.holding) return;
      var dx = e.clientX - state.lastX;
      var dy = e.clientY - state.lastY;
      state.inertiaY += dx * 0.011;
      state.inertiaX += dy * 0.011;
      state.lastX = e.clientX;
      state.lastY = e.clientY;
    }, { passive: true });
    window.addEventListener('pointerup', endHold);
    window.addEventListener('pointercancel', endHold);

    var dlBtn = label.querySelector('.dl-btn');
    var dlLabel = dlBtn.querySelector('.btn-label');
    dlBtn.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
    dlBtn.addEventListener('click', function(e){
      e.stopPropagation();
      var url = canvas.toDataURL('image/png');
      var a = document.createElement('a');
      a.href = url;
      a.download = 'thienson-' + (i + 1) + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      dlLabel.textContent = 'Đã tải ✓';
      dlBtn.classList.add('done');
      setTimeout(function(){
        dlLabel.textContent = 'Tải PNG';
        dlBtn.classList.remove('done');
      }, 1400);
    });
  });

  function resizeAll(){
    cells.forEach(function(s){
      var w = s.canvas.clientWidth;
      var h = s.canvas.clientHeight;
      if (w === 0 || h === 0) return;
      s.canvas.width = Math.round(w * DPR);
      s.canvas.height = Math.round(h * DPR);
      s.camera.aspect = w / h;
      s.camera.updateProjectionMatrix();
    });
  }
  window.addEventListener('resize', resizeAll);

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  function animate(){
    requestAnimationFrame(animate);

    var vw = window.innerWidth;
    var vh = window.innerHeight;

    cells.forEach(function(s){
      var w = s.canvas.clientWidth;
      var h = s.canvas.clientHeight;
      if (w === 0 || h === 0) return;

      // each object turns toward the cursor based on its own position on
      // screen, so objects on different sides of the grid rotate toward
      // the same focal point instead of all tilting the same direction
      var rect = s.cell.getBoundingClientRect();
      var cx = rect.left + rect.width / 2;
      var cy = rect.top + rect.height / 2;
      var dx = clamp((mouseX - cx) / (vw * 0.5), -1, 1);
      var dy = clamp((mouseY - cy) / (vh * 0.5), -1, 1);

      s.focusX += (dy - s.focusX) * 0.08;
      s.focusY += (dx - s.focusY) * 0.08;

      s.idleSpin += 0.0016;
      s.inertiaX *= 0.94;
      s.inertiaY *= 0.94;

      s.group.rotation.x = s.focusX * 0.55 + s.inertiaX;
      s.group.rotation.y = s.idleSpin + s.focusY * 0.75 + s.inertiaY;

      s.scaleCurrent += (s.scaleTarget - s.scaleCurrent) * 0.12;
      s.group.scale.setScalar(s.scaleCurrent);

      sharedRenderer.setSize(w, h, false);
      sharedRenderer.render(s.scene, s.camera);

      s.ctx2d.clearRect(0, 0, s.canvas.width, s.canvas.height);
      s.ctx2d.drawImage(sharedCanvas, 0, 0, s.canvas.width, s.canvas.height);
    });
  }

  resizeAll();
  animate();

  window.addEventListener('load', resizeAll);
})();
</script>

</body>
</html>
