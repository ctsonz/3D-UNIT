<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thiên Sơn — 3D Shapes</title>
<meta name="description" content="Bộ sưu tập object 3D miễn phí của Thiên Sơn. Di chuột để xoay, giữ để phóng to, tải ảnh về.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0b;
    --cell: #131315;
    --yellow: #FFC700;
    --text: #F3F1E7;
    --muted: #8f8d86;
    --line: rgba(255,199,0,0.14);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  @media (prefers-reduced-motion: reduce){
    * { animation-duration: 0.001ms !important; }
  }

  /* ---------- HEADER ---------- */
  header{
    display:flex;
    justify-content: space-between;
    align-items: center;
    padding: 26px 32px;
    border-bottom: 1px solid var(--line);
  }
  .logo{
    font-family: 'Archivo Black', sans-serif;
    font-size: 16px;
    letter-spacing: 0.01em;
    text-decoration: none;
    color: var(--text);
  }
  .logo span{ color: var(--yellow); }
  .credit{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .credit a{ color: var(--yellow); text-decoration: none; }

  /* ---------- INTRO ---------- */
  .intro{
    padding: 64px 32px 40px;
    max-width: 720px;
  }
  .intro .eyebrow{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--yellow);
    display:block;
    margin-bottom: 14px;
  }
  .intro h1{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: clamp(22px, 3.2vw, 30px);
    line-height: 1.4;
    margin: 0;
    color: var(--text);
  }
  .intro h1 b{ color: var(--yellow); font-weight: 700; }
  .intro p{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin: 18px 0 0;
    letter-spacing: 0.02em;
  }

  /* ---------- GRID ---------- */
  .grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--line);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  @media (max-width: 900px){ .grid{ grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 600px){ .grid{ grid-template-columns: repeat(2, 1fr); } }

  .cell{
    position: relative;
    aspect-ratio: 1 / 1;
    background: var(--cell);
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  .cell:active{ cursor: grabbing; }
  .cell canvas{
    display:block;
    width: 100%;
    height: 100%;
  }

  .cell-label{
    position:absolute;
    left:0; right:0; bottom:0;
    display:flex;
    justify-content: space-between;
    align-items:center;
    padding: 10px 12px;
    background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
  }
  .cell:hover .cell-label, .cell:focus-within .cell-label{
    opacity: 1;
    transform: translateY(0);
  }
  .shape-name{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text);
  }
  .dl-btn{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: transparent;
    color: var(--yellow);
    border: 1px solid var(--yellow);
    padding: 4px 9px;
    border-radius: 2px;
    cursor: pointer;
    pointer-events: all;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .dl-btn:hover{ background: var(--yellow); color: var(--bg); }
  .dl-btn.done{ background: var(--yellow); color: var(--bg); }

  /* ---------- FOOTER ---------- */
  footer{
    padding: 22px 32px;
    display:flex;
    justify-content: space-between;
    align-items:center;
    flex-wrap: wrap;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }
  footer a{ color: var(--yellow); text-decoration:none; }
</style>
</head>
<body>

<header>
  <a href="#" class="logo">THIÊN<span>SƠN</span></a>
  <span class="credit">Made by <a href="#" target="_blank" rel="noopener">Thiên Sơn</a></span>
</header>

<div class="intro">
  <span class="eyebrow">3D Shapes — v1.0</span>
  <h1>Bộ sưu tập <b>12 object 3D</b> miễn phí. Di chuột để xoay, giữ chuột để phóng to, bấm tải để lưu ảnh.</h1>
  <p>Placeholder — sẽ thay bằng file .glb/.obj thật sau.</p>
</div>

<div class="grid" id="grid"></div>

<footer>
  <span>© 2026 Thiên Sơn</span>
  <span>Made with <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a></span>
</footer>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
(function(){

  var shapeDefs = [
    { name: "Lập phương",   make: function(){ return new THREE.BoxGeometry(1.3,1.3,1.3); } },
    { name: "Cầu đa diện",  make: function(){ return new THREE.IcosahedronGeometry(1.15, 0); } },
    { name: "Vòng xuyến",   make: function(){ return new THREE.TorusGeometry(0.85, 0.32, 10, 24); } },
    { name: "Hình nón",     make: function(){ return new THREE.ConeGeometry(1, 1.6, 5); } },
    { name: "Bát diện",     make: function(){ return new THREE.OctahedronGeometry(1.25, 0); } },
    { name: "Trụ tròn",     make: function(){ return new THREE.CylinderGeometry(0.75, 0.75, 1.6, 8); } },
    { name: "Nút xoắn",     make: function(){ return new THREE.TorusKnotGeometry(0.65, 0.22, 64, 8); } },
    { name: "Thập nhị diện",make: function(){ return new THREE.DodecahedronGeometry(1.1, 0); } },
    { name: "Tứ diện",      make: function(){ return new THREE.TetrahedronGeometry(1.4, 0); } },
    { name: "Đá quý",       make: function(){ return new THREE.IcosahedronGeometry(1.1, 1); } },
    { name: "Kim tự tháp",  make: function(){ return new THREE.ConeGeometry(1.1, 1.6, 4); } },
    { name: "Hộp bát giác", make: function(){ return new THREE.CylinderGeometry(1, 1, 1.1, 8); } }
  ];

  var grid = document.getElementById('grid');
  var cells = [];

  var mouseNX = 0, mouseNY = 0;
  window.addEventListener('pointermove', function(e){
    mouseNX = (e.clientX / window.innerWidth) * 2 - 1;
    mouseNY = (e.clientY / window.innerHeight) * 2 - 1;
  }, { passive: true });

  shapeDefs.forEach(function(def, i){
    var cell = document.createElement('div');
    cell.className = 'cell';

    var canvas = document.createElement('canvas');
    cell.appendChild(canvas);

    var label = document.createElement('div');
    label.className = 'cell-label';
    label.innerHTML = '<span class="shape-name">' + def.name + '</span><button class="dl-btn" type="button">Tải PNG</button>';
    cell.appendChild(label);

    grid.appendChild(cell);

    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
    camera.position.set(0, 0, 4.4);

    var ambient = new THREE.AmbientLight(0xffffff, 0.55);
    scene.add(ambient);
    var key = new THREE.DirectionalLight(0xffffff, 0.9);
    key.position.set(2, 3, 4);
    scene.add(key);
    var rim = new THREE.DirectionalLight(0xffc700, 0.5);
    rim.position.set(-3, -2, -2);
    scene.add(rim);

    var group = new THREE.Group();
    scene.add(group);

    var geo = def.make();
    var solidMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1f, roughness: 0.55, metalness: 0.15 });
    var solid = new THREE.Mesh(geo, solidMat);
    group.add(solid);

    var edgesGeo = new THREE.EdgesGeometry(geo, 20);
    var edgesMat = new THREE.LineBasicMaterial({ color: 0xffc700 });
    var edges = new THREE.LineSegments(edgesGeo, edgesMat);
    group.add(edges);

    var state = {
      renderer: renderer, scene: scene, camera: camera, group: group,
      canvas: canvas, cell: cell,
      idleSpin: Math.random() * Math.PI * 2,
      inertiaX: 0, inertiaY: 0,
      scaleCurrent: 1, scaleTarget: 1,
      holding: false,
      lastX: 0, lastY: 0
    };
    cells.push(state);

    function startHold(clientX, clientY){
      state.holding = true;
      state.scaleTarget = 1.45;
      state.lastX = clientX;
      state.lastY = clientY;
      cell.setPointerCapture && cell.setPointerCapture(0);
    }
    function endHold(){
      state.holding = false;
      state.scaleTarget = 1;
    }

    cell.addEventListener('pointerdown', function(e){
      if (e.target.closest('.dl-btn')) return;
      startHold(e.clientX, e.clientY);
    });
    window.addEventListener('pointermove', function(e){
      if (!state.holding) return;
      var dx = e.clientX - state.lastX;
      var dy = e.clientY - state.lastY;
      state.inertiaY += dx * 0.006;
      state.inertiaX += dy * 0.006;
      state.lastX = e.clientX;
      state.lastY = e.clientY;
    }, { passive: true });
    window.addEventListener('pointerup', endHold);
    cell.addEventListener('pointerleave', function(){ if (state.holding) endHold(); });

    var dlBtn = label.querySelector('.dl-btn');
    dlBtn.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
    dlBtn.addEventListener('click', function(e){
      e.stopPropagation();
      renderer.render(scene, camera);
      var url = canvas.toDataURL('image/png');
      var a = document.createElement('a');
      a.href = url;
      a.download = 'thienson-' + (i + 1) + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      dlBtn.textContent = 'Đã tải ✓';
      dlBtn.classList.add('done');
      setTimeout(function(){
        dlBtn.textContent = 'Tải PNG';
        dlBtn.classList.remove('done');
      }, 1400);
    });
  });

  function resizeAll(){
    cells.forEach(function(s){
      var w = s.canvas.clientWidth;
      var h = s.canvas.clientHeight;
      if (w === 0 || h === 0) return;
      s.renderer.setSize(w, h, false);
      s.camera.aspect = w / h;
      s.camera.updateProjectionMatrix();
    });
  }
  window.addEventListener('resize', resizeAll);

  function animate(){
    requestAnimationFrame(animate);
    cells.forEach(function(s){
      s.idleSpin += 0.0016;
      s.inertiaX *= 0.94;
      s.inertiaY *= 0.94;

      s.group.rotation.x = mouseNY * 0.45 + s.inertiaX;
      s.group.rotation.y = s.idleSpin + mouseNX * 0.6 + s.inertiaY;

      s.scaleCurrent += (s.scaleTarget - s.scaleCurrent) * 0.12;
      s.group.scale.setScalar(s.scaleCurrent);

      s.renderer.render(s.scene, s.camera);
    });
  }

  resizeAll();
  animate();

  window.addEventListener('load', resizeAll);
})();
</script>

</body>
</html>
